[project]
name = "greg"
version = "2.0.0"
description = "Greg - RAG-based Document Q&A with Multiple LLM Providers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Jimmy Pocock" }
]

dependencies = [
    # LangChain Ecosystem (v1.1.x - December 2025)
    "langchain>=1.1.0",
    "langchain-core>=1.1.0",
    "langchain-community>=0.4.1",
    "langchain-text-splitters>=1.0.0",
    "langchain-huggingface>=0.1.0",
    "langchain-ollama>=0.2.0",
    "langchain-openai>=0.2.0",  # OpenAI embeddings
    # Embeddings
    "sentence-transformers>=5.1.2",
    # LLM Providers
    "anthropic>=0.75.0",
    "openai>=2.8.1",
    "google-genai>=1.0.0",
    "ollama>=0.4.0",
    # API Framework
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "python-multipart>=0.0.18",
    "pydantic>=2.10.0",
    # Document Processing
    "pypdf>=5.1.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "pillow>=11.0.0",
    # Web Scraping
    "beautifulsoup4>=4.12.0",
    # Utilities
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
    "aiofiles>=24.1.0",
    "psutil>=6.1.0",
    "tqdm>=4.67.0",
    # Security & Rate Limiting
    "slowapi>=0.1.9",
    "werkzeug>=3.1.4",
    # Database
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.0",  # Sync driver for console
    "alembic>=1.14.0",
    # Authentication
    "fastapi-users[sqlalchemy]>=14.0.0",
    "email-validator>=2.0.0",
    # 2FA
    "pyotp>=2.9.0",
    "qrcode[pil]>=7.4.0",
    # Job Queue
    "arq>=0.26.0",
    "redis>=5.0.0",
    "pgvector>=0.4.2",
    # Agent Framework (PydanticAI + LangGraph)
    "pydantic-ai>=0.0.40",
    "langgraph>=0.2.0",
    # Audio Analysis (madmom is optional, see [project.optional-dependencies])
    "librosa>=0.10.0",
    "soundfile>=0.13.0",
    # Real-time Collaboration (Yjs CRDT)
    "pycrdt>=0.10.0",
    # Payments
    "stripe>=11.0.0",
    # Observability
    "langsmith>=0.3.0",
]

[project.scripts]
greg = "packages.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]
# Note: madmom requires manual installation due to Cython build dependency
# See README.md for instructions

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages", "api"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
