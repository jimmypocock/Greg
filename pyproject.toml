[project]
name = "greg"
version = "2.0.0"
description = "Greg - RAG-based Document Q&A with Multiple LLM Providers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Jimmy Pocock" }
]

dependencies = [
    # LangChain Ecosystem (v1.1.x - December 2025)
    "langchain>=1.1.0",
    "langchain-core>=1.1.0",
    "langchain-classic>=1.0.0",  # Legacy chains (RetrievalQA, LLMChain, etc.)
    "langchain-community>=0.4.1",
    "langchain-text-splitters>=1.0.0",
    "langchain-huggingface>=0.1.0",
    "langchain-ollama>=0.2.0",
    # Vector Store
    "faiss-cpu>=1.13.0",
    "sentence-transformers>=5.1.2",
    # LLM Providers
    "anthropic>=0.75.0",
    "openai>=2.8.1",
    "google-genai>=1.0.0",
    "ollama>=0.4.0",
    # API Framework
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "python-multipart>=0.0.18",
    "pydantic>=2.10.0",
    # Document Processing
    "pypdf>=5.1.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "pillow>=11.0.0",
    # Web Scraping
    "beautifulsoup4>=4.12.0",
    # Utilities
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
    "aiofiles>=24.1.0",
    "psutil>=6.1.0",
    "tqdm>=4.67.0",
    # Security & Rate Limiting
    "slowapi>=0.1.9",
    "werkzeug>=3.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
